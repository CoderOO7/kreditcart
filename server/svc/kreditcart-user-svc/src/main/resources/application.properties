### DB cred
spring.datasource.url=jdbc:postgresql://localhost:5432/kreditcart
spring.datasource.username=root
spring.datasource.password=tooR@OO7
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO kreditcart_user_svc,public;

### Flyway config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=kreditcart_user_svc
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
logging.level.org.flywaydb=DEBUG

### jpa
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.tool.hbm2ddl=DEBUG
spring.jpa.properties.hibernate.default_schema=kreditcart_user_svc
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

### eureka config
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

### swagger
springdoc.api-docs.path=/api-docs

